spring:
  application:
    name: timesheet-management-system
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tms}
    username: ${DATABASE_USERNAME:cs}
    # Keep local application defaults aligned with docker-compose.yaml.
    # Production and shared environments must override this through DATABASE_PASSWORD.
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing developer databases created by Hibernate are recorded at V1;
    # new databases run V1__initial_schema.sql before JPA validates the schema.
    baseline-on-migrate: true
    baseline-version: 1
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  level:
    org:
      quartz: info

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
